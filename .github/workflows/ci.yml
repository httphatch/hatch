name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Create frontend stub
        run: mkdir -p frontend/dist && echo '<!doctype html>' > frontend/dist/index.html

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Create frontend stub
        run: mkdir -p frontend/dist && echo '<!doctype html>' > frontend/dist/index.html

      - uses: golangci/golangci-lint-action@v7

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: npm ci && npm run build
        working-directory: frontend

  build:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    needs: [test, lint, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: npm ci && npm run build
        working-directory: frontend

      - name: Build (arm64)
        env:
          GOARCH: arm64
          VERSION: ${{ github.sha }}
          COMMIT: ${{ github.sha }}
        run: |
          go build -ldflags "-s -w \
            -X github.com/httphatch/hatch/cmd.version=${VERSION} \
            -X github.com/httphatch/hatch/cmd.commit=${COMMIT} \
            -X github.com/httphatch/hatch/cmd.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o hatch-darwin-arm64 .

      - name: Build (amd64)
        env:
          GOARCH: amd64
          CGO_ENABLED: '1'
          CC: clang -arch x86_64
          VERSION: ${{ github.sha }}
          COMMIT: ${{ github.sha }}
        run: |
          go build -ldflags "-s -w \
            -X github.com/httphatch/hatch/cmd.version=${VERSION} \
            -X github.com/httphatch/hatch/cmd.commit=${COMMIT} \
            -X github.com/httphatch/hatch/cmd.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o hatch-darwin-amd64 .

      - uses: actions/upload-artifact@v4
        with:
          name: hatch-binaries
          path: hatch-darwin-*
          retention-days: 7
