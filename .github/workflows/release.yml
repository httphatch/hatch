name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        env:
          VITE_APP_VERSION: ${{ github.ref_name }}
        run: npm ci && npm run build
        working-directory: frontend

      - name: Build (arm64)
        env:
          GOARCH: arm64
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          go build -ldflags "-s -w \
            -X github.com/httphatch/hatch/cmd.version=${VERSION} \
            -X github.com/httphatch/hatch/cmd.commit=${COMMIT} \
            -X github.com/httphatch/hatch/cmd.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o hatch-darwin-arm64 .

      - name: Build (amd64)
        env:
          GOARCH: amd64
          CGO_ENABLED: '1'
          CC: clang -arch x86_64
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          go build -ldflags "-s -w \
            -X github.com/httphatch/hatch/cmd.version=${VERSION} \
            -X github.com/httphatch/hatch/cmd.commit=${COMMIT} \
            -X github.com/httphatch/hatch/cmd.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o hatch-darwin-amd64 .

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "${TAG}" \
            hatch-darwin-arm64 \
            hatch-darwin-amd64 \
            --generate-notes

      - name: Update Homebrew tap
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          gh api repos/httphatch/homebrew-tap/dispatches \
            -f event_type=formula-update \
            -f 'client_payload[version]'="${VERSION}"
